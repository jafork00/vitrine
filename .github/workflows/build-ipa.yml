
name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options:
          - artifacts

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          GH_TOKEN: ${{ secrets.IPA_READ_TOKEN }}
        run: |
          mkdir -p ipa
          gh release download v1 \
            --repo jafork00/vitrine-ipa-input \
            --pattern "*.ipa" \
            --output ipa/spotify.ipa
          file ipa/spotify.ipa

      - name: Build Vitrine
        run: make release

      - uses: actions/upload-artifact@v5
        with:
          name: vitrine-ipa
          path: out/*.ipa
          if-no-files-found: error
